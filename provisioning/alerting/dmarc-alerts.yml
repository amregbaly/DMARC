apiVersion: 1

groups:
  - orgId: 1
    name: DMARC Alerts
    folder: DMARC
    interval: 5m
    rules:
      # Alert 1: DMARC pass rate below 90% for a domain over 24h
      - uid: dmarc-low-pass-rate
        title: "DMARC pass rate below 90%"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: opensearch-dmarc
            model:
              query: "header_from.keyword:$domain"
              metrics:
                - type: sum
                  field: message_count
                  id: "1"
              bucketAggs:
                - type: terms
                  field: header_from.keyword
                  id: "2"
                  settings:
                    size: "50"
                    order: desc
                    orderBy: "1"
                    min_doc_count: "1"
              timeField: date_begin
          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: opensearch-dmarc
            model:
              query: "header_from.keyword:$domain AND passed_dmarc:true"
              metrics:
                - type: sum
                  field: message_count
                  id: "1"
              bucketAggs:
                - type: terms
                  field: header_from.keyword
                  id: "2"
                  settings:
                    size: "50"
                    order: desc
                    orderBy: "1"
                    min_doc_count: "1"
              timeField: date_begin
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$B / $A * 100 < 90"
        noDataState: OK
        execErrState: Error
        for: 1h
        isPaused: true
        annotations:
          summary: "DMARC pass rate is below 90% for one or more domains in the last 24 hours."
          description: "Investigate failing IPs and authentication issues in the DMARC dashboard."
        labels:
          severity: warning

      # Alert 2: Non-allowlisted IP sends >50 failing messages in 24h
      - uid: dmarc-unauthorized-ip-volume
        title: "Non-allowlisted IP sending >50 failing messages"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: opensearch-dmarc
            model:
              query: "passed_dmarc:false AND NOT source_ip_address.keyword:(209.85.220.41 OR 40.107.22.100 OR 192.0.2.50)"
              metrics:
                - type: sum
                  field: message_count
                  id: "1"
              bucketAggs:
                - type: terms
                  field: source_ip_address.keyword
                  id: "2"
                  settings:
                    size: "50"
                    order: desc
                    orderBy: "1"
                    min_doc_count: "1"
              timeField: date_begin
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 50
        noDataState: OK
        execErrState: Error
        for: 30m
        isPaused: true
        annotations:
          summary: "A non-allowlisted IP is sending more than 50 DMARC-failing messages in the last 24 hours."
          description: "Check the Spoofing Suspects panel for details. Update the known_ips allowlist in the alert query if the IP is legitimate."
        labels:
          severity: critical

      # Alert 3: No reports from major reporter in 48h
      - uid: dmarc-missing-reporter
        title: "No reports from major reporter in 48h"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 172800
              to: 0
            datasourceUid: opensearch-dmarc
            model:
              query: "org_name.keyword:(google.com OR microsoft.com OR yahoo.com)"
              metrics:
                - type: count
                  id: "1"
              bucketAggs:
                - type: terms
                  field: org_name.keyword
                  id: "2"
                  settings:
                    size: "10"
                    order: desc
                    orderBy: "1"
                    min_doc_count: "0"
              timeField: date_begin
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: Alerting
        execErrState: Error
        for: 1h
        isPaused: true
        annotations:
          summary: "No DMARC reports received from a major reporting organization (Google, Microsoft, Yahoo) in the last 48 hours."
          description: "Check the Data Health row to verify report ingestion status."
        labels:
          severity: warning

      # Alert 4: Reject disposition on high-volume traffic
      - uid: dmarc-high-volume-reject
        title: "Reject disposition on high-volume traffic"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: opensearch-dmarc
            model:
              query: "disposition.keyword:reject"
              metrics:
                - type: sum
                  field: message_count
                  id: "1"
              bucketAggs: []
              timeField: date_begin
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 100
        noDataState: OK
        execErrState: Error
        for: 30m
        isPaused: true
        annotations:
          summary: "More than 100 messages received 'reject' disposition in the last 24 hours."
          description: "This could indicate a large-scale spoofing attack or a misconfigured legitimate sender. Check the Security row."
        labels:
          severity: critical
